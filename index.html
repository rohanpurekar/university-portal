<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitor Pass</title>
</head>
<body>
<h1>Visitor Pass</h1>

<p>
  Role:
  <select id="role">
    <option>Visitor</option>
    <option>Host</option>
    <option>Guard</option>
  </select>
</p>
<hr>

<div id="visitor">
  <h2>Request a pass</h2>
  <p>Name: <input id="name"></p>
  <p>Date: <input id="date" type="date"></p>
  <p>Host: <input id="host"></p>
  <button id="submit">Submit</button>
</div>

<div id="hostlogin">
  <h2>Host login</h2>
  <p>Username: <input id="username"></p>
  <p>Password: <input id="password" type="password"></p>
  <button id="login">Login</button>
</div>

<div id="hostview">
  <h2>Pending requests</h2>
  <p><button id="logout">Logout</button></p>
  <div id="pending"></div>
</div>

<div id="guard">
  <h2>Check a pass code</h2>
  <p>Code: <input id="code" maxlength="6"></p>
  <button id="check">Check</button>
</div>

<p id="message"></p>

<div id="logbox">
  <hr>
  <h3>Log</h3>
  <pre id="log"></pre>
</div>

<script>
// ---- Data layer ----
var passes = JSON.parse(localStorage.getItem("passes") || "[]");
function save() { localStorage.setItem("passes", JSON.stringify(passes)); }

// ---- Host login (demo only: credentials are in the page, so this is not real security) ----
var HOST_USER = "admin";
var HOST_PASS = "admin";
var loggedIn = false;

function login(username, password) {
  if (username === HOST_USER && password === HOST_PASS) {
    loggedIn = true;
    log("LOGIN OK: " + username);
    return true;
  }
  log("LOGIN FAILED: " + username);
  return false;
}

function logout() {
  loggedIn = false;
  log("LOGOUT");
}

// ---- Security: who may do what (deny by default) ----
var allowed = {
  request: ["Visitor"],
  list: ["Host"],
  decide: ["Host"],
  check: ["Guard"]
};

function log(text) {
  var box = document.getElementById("log");
  box.textContent = new Date().toLocaleTimeString() + "  " + text + "\n" + box.textContent;
}

function authorize(role, action) {
  if (!allowed[action] || allowed[action].indexOf(role) === -1) {
    log("DENIED: " + role + " tried to " + action);
    throw new Error("Not allowed: " + role + " cannot " + action);
  }
  if (role === "Host" && !loggedIn) {
    log("DENIED: Host not logged in tried to " + action);
    throw new Error("Please log in as host first.");
  }
  log("ALLOWED: " + role + " -> " + action);
}

// ---- Business layer ----
function validate(name, date, host) {
  var namePattern = /^[A-Za-z][A-Za-z '.-]{1,59}$/;
  var today = new Date().toISOString().slice(0, 10);
  if (!namePattern.test(name)) throw new Error("Name must be 2-60 letters.");
  if (!namePattern.test(host)) throw new Error("Host must be 2-60 letters.");
  if (!date) throw new Error("Please pick a date.");
  if (date < today) throw new Error("Date cannot be in the past.");
}

function makeCode() {
  var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var code = "";
  for (var i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

function requestPass(role, name, date, host) {
  authorize(role, "request");
  name = name.trim();
  host = host.trim();
  validate(name, date, host);
  passes.push({ id: Date.now(), name: name, date: date, host: host, status: "pending", code: "" });
  save();
}

function listPending(role) {
  authorize(role, "list");
  return passes.filter(function (p) { return p.status === "pending"; });
}

function decide(role, id, approve) {
  authorize(role, "decide");
  var p = passes.find(function (x) { return x.id === id; });
  if (!p || p.status !== "pending") throw new Error("Request not found.");
  p.status = approve ? "approved" : "disapproved";
  if (approve) p.code = makeCode();
  save();
  log((approve ? "APPROVED: " : "DISAPPROVED: ") + p.name);
  return p;
}

function checkCode(role, code) {
  authorize(role, "check");
  code = code.trim().toUpperCase();
  var today = new Date().toISOString().slice(0, 10);
  var valid = /^[A-Z0-9]{6}$/.test(code) && passes.some(function (p) {
    return p.status === "approved" && p.code === code && p.date >= today;
  });
  log("CODE CHECK: " + code + " -> " + (valid ? "VALID" : "INVALID"));
  return valid;
}

// ---- UI ----
var msg = document.getElementById("message");

function currentRole() { return document.getElementById("role").value; }

function show(role) {
  var isHost = role === "Host";
  document.getElementById("visitor").style.display = role === "Visitor" ? "" : "none";
  document.getElementById("hostlogin").style.display = isHost && !loggedIn ? "" : "none";
  document.getElementById("hostview").style.display = isHost && loggedIn ? "" : "none";
  document.getElementById("guard").style.display = role === "Guard" ? "" : "none";
  // Log is visible to a logged-in Host and to the Guard
  document.getElementById("logbox").style.display = (isHost && loggedIn) || role === "Guard" ? "" : "none";
  msg.textContent = "";
  if (isHost && loggedIn) drawPending();
}

function drawPending() {
  var box = document.getElementById("pending");
  box.textContent = "";
  var list = listPending("Host");
  if (list.length === 0) box.textContent = "Nothing pending.";
  list.forEach(function (p) {
    var row = document.createElement("p");
    row.textContent = p.name + " | " + p.date + " | host: " + p.host + " ";
    var yes = document.createElement("button");
    yes.textContent = "Approve";
    yes.onclick = function () { act(p.id, true); };
    var no = document.createElement("button");
    no.textContent = "Disapprove";
    no.onclick = function () { act(p.id, false); };
    row.appendChild(yes);
    row.appendChild(no);
    box.appendChild(row);
  });
}

function act(id, approve) {
  try {
    var p = decide(currentRole(), id, approve);
    drawPending();
    msg.textContent = approve ? "Approved " + p.name + ". Pass code: " + p.code : "Disapproved " + p.name + ".";
  } catch (e) {
    msg.textContent = e.message;
  }
}

document.getElementById("role").onchange = function () {
  if (this.value !== "Host" && loggedIn) logout();
  show(this.value);
};

document.getElementById("submit").onclick = function () {
  try {
    requestPass(currentRole(), document.getElementById("name").value,
                document.getElementById("date").value,
                document.getElementById("host").value);
    msg.textContent = "Request sent. Waiting for host approval.";
    document.getElementById("name").value = "";
    document.getElementById("date").value = "";
    document.getElementById("host").value = "";
  } catch (e) {
    msg.textContent = e.message;
  }
};

document.getElementById("login").onclick = function () {
  var user = document.getElementById("username").value;
  var pass = document.getElementById("password").value;
  document.getElementById("password").value = "";
  if (login(user, pass)) {
    document.getElementById("username").value = "";
    show("Host");
  } else {
    msg.textContent = "Wrong username or password.";
  }
};

document.getElementById("logout").onclick = function () {
  logout();
  show("Host");
  msg.textContent = "Logged out.";
};

document.getElementById("check").onclick = function () {
  try {
    msg.textContent = checkCode(currentRole(), document.getElementById("code").value) ? "VALID" : "INVALID";
  } catch (e) {
    msg.textContent = e.message;
  }
};

show("Visitor");
</script>
</body>
</html>
